# Отдельный виртуальный хост сайта; остальные сайты сервера не меняются.
server {
    listen 80;
    listen [::]:80;
    server_name dpd-ozon.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 301 https://dpd-ozon.ru$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dpd-ozon.ru;
    root /var/www/OZON-DPD;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/dpd-ozon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dpd-ozon.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ =404; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~ /\. { deny all; }
}
